<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4973B"/>
      <stop offset="100%" stop-color="#D4A94E"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D2B55"/>
      <stop offset="100%" stop-color="#3E3C6E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E3C6E"/>
      <stop offset="100%" stop-color="#524F80"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8862D"/>
      <stop offset="50%" stop-color="#C4973B"/>
      <stop offset="100%" stop-color="#D4A94E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F8F5"/>
      <stop offset="100%" stop-color="#F0EDE6"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#2D2B55" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowSm" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#2D2B55" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowNavy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2D2B55"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C4973B"/>
    </marker>
    <marker id="arrowGoldDash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C4973B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1320" rx="20" fill="url(#bgGrad)"/>

  <!-- ===================== TITLE ===================== -->
  <text x="550" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#2D2B55" letter-spacing="-0.5">
    AI Executive Assistant
    <tspan fill="#C4973B"> — Email Automation</tspan>
  </text>
  <text x="550" y="76" text-anchor="middle" font-size="13" fill="#8B8BAA">
    High-Level Architecture — Event-Driven · Webhook-Based · RAG-Augmented
  </text>

  <!-- ===================== EXTERNAL: EMAIL PROVIDERS ===================== -->
  <rect x="300" y="100" width="500" height="80" rx="12" fill="#FFFCF5" stroke="#C4973B" stroke-width="2" filter="url(#shadowSm)"/>
  <text x="550" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#C4973B">Email Providers</text>
  <text x="550" y="152" text-anchor="middle" font-size="12" fill="#6B6B8D">Gmail · Outlook · Any IMAP Provider</text>
  <!-- Provider pills -->
  <rect x="390" y="158" width="60" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="420" y="170" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Gmail</text>
  <rect x="458" y="158" width="60" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="488" y="170" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Outlook</text>
  <rect x="526" y="158" width="60" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="556" y="170" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">IMAP</text>

  <!-- Arrow: Email → Nylas -->
  <line x1="550" y1="180" x2="550" y2="220" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- ===================== NYLAS API (Inbound) ===================== -->
  <rect x="330" y="228" width="440" height="70" rx="12" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="550" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Nylas Unified Email API</text>
  <text x="550" y="276" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Webhook push on new email events</text>
  <rect x="510" y="282" width="80" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="550" y="292" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">WEBHOOK</text>

  <!-- Arrow: Nylas → FastAPI -->
  <line x1="550" y1="298" x2="550" y2="338" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="562" y="322" font-size="10" fill="#8B8BAA">POST /events/</text>

  <!-- ===================== SYSTEM BOUNDARY ===================== -->
  <rect x="50" y="346" width="1000" height="610" rx="16" fill="none" stroke="#2D2B55" stroke-width="2.5"/>
  <rect x="80" y="334" width="200" height="26" rx="8" fill="#2D2B55"/>
  <text x="180" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" letter-spacing="1">APPLICATION SERVER</text>

  <!-- ===================== FASTAPI ===================== -->
  <rect x="350" y="370" width="400" height="75" rx="12" fill="url(#navyGrad)" filter="url(#shadow)"/>
  <text x="550" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">FastAPI Application</text>
  <text x="550" y="418" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">Receive webhook event · Persist · Return HTTP 202</text>
  <rect x="510" y="426" width="80" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="550" y="436" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Uvicorn ASGI</text>

  <!-- Arrow: FastAPI → PostgreSQL (persist) -->
  <line x1="450" y1="445" x2="450" y2="490" stroke="#2D2B55" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="435" y="474" text-anchor="end" font-size="10" fill="#8B8BAA">persist event</text>

  <!-- Arrow: FastAPI → Redis (enqueue) -->
  <line x1="650" y1="445" x2="650" y2="490" stroke="#2D2B55" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="665" y="474" text-anchor="start" font-size="10" fill="#8B8BAA">enqueue task</text>

  <!-- ===================== TIER: PostgreSQL + Redis side by side ===================== -->
  <!-- PostgreSQL -->
  <rect x="250" y="498" width="300" height="70" rx="12" fill="url(#warmGrad)" filter="url(#shadow)"/>
  <text x="400" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PostgreSQL 15 + pgvector</text>
  <text x="400" y="546" text-anchor="middle" font-size="11" fill="#fff" opacity="0.9">Events · TaskContext · Vector embeddings</text>

  <!-- Redis -->
  <rect x="580" y="498" width="260" height="70" rx="12" fill="#F0EDE6" stroke="#D9D3C7" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="710" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#2D2B55">Redis</text>
  <text x="710" y="546" text-anchor="middle" font-size="11" fill="#6B6B8D">Celery broker · Result backend</text>

  <!-- Arrow: Redis → Celery -->
  <line x1="710" y1="568" x2="710" y2="600" stroke="#2D2B55" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="722" y="590" text-anchor="start" font-size="10" fill="#8B8BAA">consume</text>

  <!-- ===================== CELERY WORKER + WORKFLOW ENGINE ===================== -->
  <rect x="100" y="608" width="900" height="420" rx="14" fill="url(#navyGrad)" filter="url(#shadow)"/>
  <text x="550" y="636" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Celery Worker — Async Processing</text>

  <!-- Workflow Engine dashed box -->
  <rect x="140" y="650" width="820" height="268" rx="12" fill="none" stroke="#C4973B" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="170" y="638" width="140" height="24" rx="6" fill="#C4973B"/>
  <text x="240" y="654" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Workflow Engine</text>

  <!-- Node 1: Filter -->
  <rect x="168" y="675" width="140" height="56" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="238" y="698" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">Filter Node</text>
  <text x="238" y="716" text-anchor="middle" font-size="10" fill="#8B8BAA">Configured senders only</text>

  <!-- Arrow 1→2 -->
  <line x1="308" y1="703" x2="338" y2="703" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 2: Classify (Agent) -->
  <rect x="346" y="675" width="150" height="56" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="421" y="698" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">Classify Agent</text>
  <text x="421" y="716" text-anchor="middle" font-size="10" fill="#8B8BAA">GPT-4o-mini → category</text>

  <!-- Arrow 2→3 -->
  <line x1="496" y1="703" x2="526" y2="703" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 3: Router -->
  <rect x="534" y="675" width="150" height="56" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="609" y="698" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">Router Node</text>
  <text x="609" y="716" text-anchor="middle" font-size="10" fill="#8B8BAA">Category-based dispatch</text>

  <!-- Arrow 3→4 -->
  <line x1="684" y1="703" x2="714" y2="703" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 4: Handler -->
  <rect x="722" y="675" width="150" height="56" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="797" y="698" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">Handler Nodes</text>
  <text x="797" y="716" text-anchor="middle" font-size="10" fill="#8B8BAA">Category-specific action</text>

  <!-- Router outcomes (small pills below) -->
  <rect x="160" y="755" width="100" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="210" y="770" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Spam → Archive</text>

  <rect x="275" y="755" width="120" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="335" y="770" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Message → Reply</text>

  <rect x="410" y="755" width="140" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="480" y="770" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Invoice → Extract Data</text>

  <rect x="565" y="755" width="140" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="635" y="770" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Program → RAG Answer</text>

  <rect x="720" y="755" width="130" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="785" y="770" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Unknown → Escalate</text>

  <!-- Connecting lines from Router to outcome pills -->
  <line x1="609" y1="731" x2="609" y2="743" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="210" y1="743" x2="785" y2="743" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="210" y1="743" x2="210" y2="755" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="335" y1="743" x2="335" y2="755" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="480" y1="743" x2="480" y2="755" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="635" y1="743" x2="635" y2="755" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="785" y1="743" x2="785" y2="755" stroke="#C4973B" stroke-width="1" opacity="0.5"/>

  <!-- ===================== RAG PIPELINE (Highlighted) ===================== -->
  <!-- RAG container with prominent styling -->
  <rect x="160" y="790" width="790" height="120" rx="10" fill="rgba(196,151,59,0.06)" stroke="#C4973B" stroke-width="2.5"/>
  <!-- RAG label badge -->
  <rect x="190" y="778" width="180" height="24" rx="6" fill="#C4973B"/>
  <text x="280" y="794" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">RAG Pipeline (pgvector)</text>
  <!-- Pulsing highlight ring -->
  <rect x="156" y="786" width="798" height="128" rx="12" fill="none" stroke="#C4973B" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- RAG Step 1: Embed Query -->
  <rect x="185" y="820" width="120" height="50" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="245" y="842" text-anchor="middle" font-size="11" font-weight="600" fill="#2D2B55">Embed Query</text>
  <text x="245" y="858" text-anchor="middle" font-size="9" fill="#8B8BAA">text-embed-3-small</text>

  <!-- Arrow -->
  <line x1="305" y1="845" x2="330" y2="845" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- RAG Step 2: Vector Search -->
  <rect x="338" y="820" width="130" height="50" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="403" y="842" text-anchor="middle" font-size="11" font-weight="600" fill="#2D2B55">Vector Search</text>
  <text x="403" y="858" text-anchor="middle" font-size="9" fill="#8B8BAA">pgvector cosine sim</text>

  <!-- Arrow -->
  <line x1="468" y1="845" x2="493" y2="845" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- RAG Step 3: Top-K Context -->
  <rect x="501" y="820" width="120" height="50" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="561" y="842" text-anchor="middle" font-size="11" font-weight="600" fill="#2D2B55">Top-K Context</text>
  <text x="561" y="858" text-anchor="middle" font-size="9" fill="#8B8BAA">Retrieve passages</text>

  <!-- Arrow -->
  <line x1="621" y1="845" x2="646" y2="845" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- RAG Step 4: Prompt + Agent -->
  <rect x="654" y="820" width="130" height="50" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="719" y="842" text-anchor="middle" font-size="11" font-weight="600" fill="#2D2B55">Agent + Prompt</text>
  <text x="719" y="858" text-anchor="middle" font-size="9" fill="#8B8BAA">Jinja2 → pydantic-ai</text>

  <!-- Arrow -->
  <line x1="784" y1="845" x2="809" y2="845" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- RAG Step 5: Grounded Response / Escalate -->
  <rect x="817" y="820" width="110" height="50" rx="8" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1.5"/>
  <text x="872" y="842" text-anchor="middle" font-size="11" font-weight="600" fill="#C4973B">Respond</text>
  <text x="872" y="858" text-anchor="middle" font-size="9" fill="#8B8BAA">or Escalate</text>

  <!-- Annotation: confidence check -->
  <text x="555" y="900" text-anchor="middle" font-size="10" font-style="italic" fill="#8B8BAA">If confidence is insufficient → escalates to human instead of guessing</text>

  <!-- ===================== ARROW: Celery → Nylas (outbound) ===================== -->
  <line x1="550" y1="970" x2="550" y2="1010" stroke="#2D2B55" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="562" y="997" font-size="10" fill="#8B8BAA">action</text>

  <!-- ===================== NYLAS API (Outbound Action) ===================== -->
  <rect x="330" y="1018" width="440" height="55" rx="12" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="550" y="1042" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Nylas API — Outbound Actions</text>
  <text x="550" y="1058" text-anchor="middle" font-size="11" fill="#fff" opacity="0.9">Send reply · Archive · Forward · Escalate</text>

  <!-- ===================== ARROWS TO EXTERNAL SERVICES ===================== -->
  <!-- Left: LLM Providers -->
  <line x1="380" y1="1086" x2="380" y2="1175" stroke="#C4973B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGoldDash)"/>
  <text x="365" y="1135" text-anchor="end" font-size="10" fill="#8B8BAA" transform="rotate(-90, 365, 1135)">LLM API calls</text>

  <!-- Right: Langfuse -->
  <line x1="720" y1="1086" x2="720" y2="1175" stroke="#C4973B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGoldDash)"/>
  <text x="735" y="1135" text-anchor="start" font-size="10" fill="#8B8BAA" transform="rotate(-90, 735, 1135)">traces &amp; spans</text>

  <!-- ===================== EXTERNAL: LLM PROVIDERS ===================== -->
  <rect x="120" y="1185" width="380" height="100" rx="12" fill="#FFFCF5" stroke="#C4973B" stroke-width="2" filter="url(#shadowSm)"/>
  <text x="310" y="1216" text-anchor="middle" font-size="15" font-weight="700" fill="#C4973B">LLM Providers</text>
  <text x="310" y="1238" text-anchor="middle" font-size="11" fill="#6B6B8D">OpenAI · Anthropic · Google Gemini</text>
  <text x="310" y="1256" text-anchor="middle" font-size="11" fill="#6B6B8D">AWS Bedrock · Ollama (local)</text>
  <rect x="196" y="1262" width="56" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="224" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">GPT-4o</text>
  <rect x="260" y="1262" width="56" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="288" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Claude</text>
  <rect x="324" y="1262" width="56" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="352" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Gemini</text>
  <rect x="388" y="1262" width="56" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="416" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Ollama</text>

  <!-- ===================== EXTERNAL: OBSERVABILITY ===================== -->
  <rect x="560" y="1185" width="380" height="100" rx="12" fill="#FFFCF5" stroke="#C4973B" stroke-width="2" filter="url(#shadowSm)"/>
  <text x="750" y="1216" text-anchor="middle" font-size="15" font-weight="700" fill="#C4973B">Observability Stack</text>
  <text x="750" y="1238" text-anchor="middle" font-size="11" fill="#6B6B8D">Langfuse · OpenTelemetry · Logfire</text>
  <text x="750" y="1256" text-anchor="middle" font-size="11" fill="#6B6B8D">Traces · Token metrics · Latency · Cost tracking</text>
  <rect x="636" y="1262" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="662" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Traces</text>
  <rect x="696" y="1262" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="722" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Metrics</text>
  <rect x="756" y="1262" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="782" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Costs</text>
  <rect x="816" y="1262" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="842" y="1274" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Errors</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="200" y="1340" width="700" height="60" rx="10" fill="#fff" filter="url(#shadowSm)"/>
  <rect x="230" y="1360" width="16" height="16" rx="4" fill="url(#goldGrad)"/>
  <text x="254" y="1373" font-size="11" fill="#6B6B8D">Gateway / API Layer</text>
  <rect x="400" y="1360" width="16" height="16" rx="4" fill="url(#navyGrad)"/>
  <text x="424" y="1373" font-size="11" fill="#6B6B8D">Core Services</text>
  <rect x="550" y="1360" width="16" height="16" rx="4" fill="#F0EDE6" stroke="#D9D3C7" stroke-width="1"/>
  <text x="574" y="1373" font-size="11" fill="#6B6B8D">Infrastructure</text>
  <rect x="690" y="1360" width="16" height="16" rx="4" fill="#FFFCF5" stroke="#C4973B" stroke-width="1.5"/>
  <text x="714" y="1373" font-size="11" fill="#6B6B8D">External Services</text>

</svg>
