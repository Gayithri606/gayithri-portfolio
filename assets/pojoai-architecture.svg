<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4973B"/>
      <stop offset="100%" stop-color="#D4A94E"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D2B55"/>
      <stop offset="100%" stop-color="#3E3C6E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E3C6E"/>
      <stop offset="100%" stop-color="#524F80"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8862D"/>
      <stop offset="50%" stop-color="#C4973B"/>
      <stop offset="100%" stop-color="#D4A94E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F8F5"/>
      <stop offset="100%" stop-color="#F0EDE6"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#2D2B55" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowSm" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#2D2B55" flood-opacity="0.06"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowNavy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2D2B55"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C4973B"/>
    </marker>
    <marker id="arrowGoldDash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C4973B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1320" rx="20" fill="url(#bgGrad)"/>

  <!-- ===================== TITLE ===================== -->
  <text x="550" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#2D2B55" letter-spacing="-0.5">
    AI Customer Support
    <tspan fill="#C4973B"> Automation Platform</tspan>
  </text>
  <text x="550" y="76" text-anchor="middle" font-size="13" fill="#8B8BAA">
    High-Level Architecture — Event-Driven · RAG-Augmented · Cloud-Native
  </text>

  <!-- ===================== HETZNER CLOUD BOX ===================== -->
  <rect x="50" y="100" width="1000" height="930" rx="16" fill="none" stroke="#2D2B55" stroke-width="2.5"/>
  <!-- Cloud label -->
  <rect x="80" y="88" width="210" height="26" rx="8" fill="#2D2B55"/>
  <text x="185" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" letter-spacing="1">HETZNER CLOUD SERVER</text>

  <!-- =========== TIER 1: CADDY =========== -->
  <rect x="300" y="130" width="500" height="80" rx="12" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="550" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Caddy Reverse Proxy</text>
  <text x="550" y="182" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Auto-SSL via Let's Encrypt · Domain-based routing</text>
  <rect x="510" y="192" width="80" height="16" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="550" y="203" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">:443 HTTPS</text>

  <!-- =========== SPLIT ARROWS from Caddy =========== -->
  <!-- Left arrow to FastAPI -->
  <line x1="420" y1="210" x2="420" y2="260" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="390" y="240" text-anchor="end" font-size="10" fill="#8B8BAA">api.domain.com</text>
  <!-- Right arrow to Supabase -->
  <line x1="680" y1="210" x2="680" y2="260" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="710" y="240" text-anchor="start" font-size="10" fill="#8B8BAA">supabase.domain.com</text>

  <!-- =========== TIER 2: FASTAPI =========== -->
  <rect x="230" y="268" width="340" height="90" rx="12" fill="url(#navyGrad)" filter="url(#shadow)"/>
  <text x="400" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">FastAPI Application</text>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">POST /events/ · POST /v1/chat/completions</text>
  <text x="400" y="334" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">Uvicorn ASGI Server</text>
  <rect x="376" y="342" width="48" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="400" y="352" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">:8080</text>

  <!-- =========== TIER 2: SUPABASE =========== -->
  <rect x="610" y="268" width="340" height="90" rx="12" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <text x="780" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Supabase Stack</text>
  <text x="780" y="318" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">Kong Gateway · GoTrue Auth</text>
  <text x="780" y="334" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">PostgREST · Realtime · Studio</text>
  <rect x="756" y="342" width="48" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="780" y="352" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">:8000</text>

  <!-- =========== ARROW: FastAPI → Redis =========== -->
  <line x1="400" y1="358" x2="400" y2="400" stroke="#2D2B55" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="412" y="388" font-size="10" fill="#8B8BAA">enqueue task</text>

  <!-- =========== TIER 3: REDIS =========== -->
  <rect x="310" y="408" width="260" height="70" rx="12" fill="#F0EDE6" stroke="#D9D3C7" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="440" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#2D2B55">Redis</text>
  <text x="440" y="456" text-anchor="middle" font-size="11" fill="#6B6B8D">Celery message broker · Task queue</text>
  <rect x="418" y="462" width="52" height="14" rx="4" fill="rgba(45,43,85,0.08)"/>
  <text x="444" y="472" text-anchor="middle" font-size="9" font-weight="600" fill="#2D2B55">BROKER</text>

  <!-- =========== ARROW: Redis → Celery =========== -->
  <line x1="440" y1="478" x2="440" y2="518" stroke="#2D2B55" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="452" y="506" font-size="10" fill="#8B8BAA">consume task</text>

  <!-- =========== TIER 4: CELERY WORKER =========== -->
  <rect x="100" y="526" width="900" height="240" rx="14" fill="url(#navyGrad)" filter="url(#shadow)"/>
  <text x="550" y="556" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Celery Worker</text>

  <!-- Workflow Engine dashed box -->
  <rect x="140" y="570" width="820" height="178" rx="12" fill="none" stroke="#C4973B" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- Workflow label -->
  <rect x="170" y="558" width="140" height="24" rx="6" fill="#C4973B"/>
  <text x="240" y="574" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Workflow Engine</text>

  <!-- Node 1: Concurrent -->
  <rect x="168" y="600" width="160" height="66" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="248" y="624" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">Concurrent Node</text>
  <text x="248" y="644" text-anchor="middle" font-size="10" fill="#8B8BAA">Parallel LLM analysis</text>
  <text x="248" y="658" text-anchor="middle" font-size="10" fill="#8B8BAA">(intent, spam, validate)</text>

  <!-- Arrow 1→2 -->
  <line x1="328" y1="633" x2="368" y2="633" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 2: RAG -->
  <rect x="376" y="600" width="160" height="66" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="456" y="624" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">RAG Retrieval</text>
  <text x="456" y="644" text-anchor="middle" font-size="10" fill="#8B8BAA">Embed → Search → Top-K</text>
  <text x="456" y="658" text-anchor="middle" font-size="10" fill="#8B8BAA">pgvector similarity</text>

  <!-- Arrow 2→3 -->
  <line x1="536" y1="633" x2="576" y2="633" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 3: Agent -->
  <rect x="584" y="600" width="160" height="66" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="664" y="624" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">Agent Node</text>
  <text x="664" y="644" text-anchor="middle" font-size="10" fill="#8B8BAA">Jinja2 prompt + RAG ctx</text>
  <text x="664" y="658" text-anchor="middle" font-size="10" fill="#8B8BAA">pydantic-ai → LLM</text>

  <!-- Arrow 3→4 -->
  <line x1="744" y1="633" x2="784" y2="633" stroke="#C4973B" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 4: Router -->
  <rect x="792" y="600" width="148" height="66" rx="8" fill="#fff" stroke="#C4973B" stroke-width="1.5"/>
  <text x="866" y="624" text-anchor="middle" font-size="13" font-weight="600" fill="#2D2B55">Router Node</text>
  <text x="866" y="644" text-anchor="middle" font-size="10" fill="#8B8BAA">Intent-based dispatch</text>
  <text x="866" y="658" text-anchor="middle" font-size="10" fill="#8B8BAA">escalate / close / reply</text>

  <!-- Router outcomes (small pills below Router) -->
  <rect x="172" y="690" width="108" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="226" y="705" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Close Ticket</text>

  <rect x="296" y="690" width="108" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="350" y="705" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Escalate</text>

  <rect x="420" y="690" width="120" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="480" y="705" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Process Invoice</text>

  <rect x="556" y="690" width="130" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="621" y="705" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Generate Response</text>

  <rect x="702" y="690" width="108" height="22" rx="6" fill="rgba(196,151,59,0.15)" stroke="#C4973B" stroke-width="1"/>
  <text x="756" y="705" text-anchor="middle" font-size="9" font-weight="600" fill="#C4973B">Send Reply</text>

  <!-- Small connecting lines from Router to outcome pills -->
  <line x1="830" y1="666" x2="830" y2="680" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="226" y1="680" x2="830" y2="680" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="226" y1="680" x2="226" y2="690" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="350" y1="680" x2="350" y2="690" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="480" y1="680" x2="480" y2="690" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="621" y1="680" x2="621" y2="690" stroke="#C4973B" stroke-width="1" opacity="0.5"/>
  <line x1="756" y1="680" x2="756" y2="690" stroke="#C4973B" stroke-width="1" opacity="0.5"/>

  <!-- =========== ARROW: Celery → PostgreSQL =========== -->
  <line x1="550" y1="766" x2="550" y2="810" stroke="#2D2B55" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <!-- =========== TIER 5: POSTGRESQL =========== -->
  <rect x="250" y="818" width="600" height="80" rx="12" fill="url(#warmGrad)" filter="url(#shadow)"/>
  <text x="550" y="850" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PostgreSQL 15 + pgvector</text>
  <text x="550" y="870" text-anchor="middle" font-size="12" fill="#fff" opacity="0.9">Events table · Vector embeddings store · Auth &amp; storage schemas</text>
  <rect x="487" y="880" width="126" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="550" y="891" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Supabase-managed</text>

  <!-- =========== Supabase → PostgreSQL connector =========== -->
  <line x1="780" y1="358" x2="780" y2="380" stroke="#524F80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="780" y1="380" x2="940" y2="380" stroke="#524F80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="940" y1="380" x2="940" y2="850" stroke="#524F80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="940" y1="850" x2="850" y2="850" stroke="#524F80" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowNavy)"/>

  <!-- =========== ARROWS OUT OF CLOUD =========== -->
  <!-- Left: LLM Providers -->
  <line x1="380" y1="930" x2="380" y2="936" stroke="none"/>
  <line x1="380" y1="898" x2="380" y2="1060" stroke="#C4973B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGoldDash)"/>
  <text x="365" y="990" text-anchor="end" font-size="10" fill="#8B8BAA" transform="rotate(-90, 365, 990)">outbound LLM API calls</text>

  <!-- Right: Langfuse -->
  <line x1="720" y1="898" x2="720" y2="1060" stroke="#C4973B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGoldDash)"/>
  <text x="735" y="990" text-anchor="start" font-size="10" fill="#8B8BAA" transform="rotate(-90, 735, 990)">traces &amp; spans</text>

  <!-- =========== EXTERNAL: LLM PROVIDERS =========== -->
  <rect x="120" y="1075" width="380" height="110" rx="12" fill="#FFFCF5" stroke="#C4973B" stroke-width="2" filter="url(#shadowSm)"/>
  <text x="310" y="1106" text-anchor="middle" font-size="15" font-weight="700" fill="#C4973B">LLM Providers</text>
  <text x="310" y="1128" text-anchor="middle" font-size="11" fill="#6B6B8D">OpenAI · Anthropic · Google Gemini</text>
  <text x="310" y="1146" text-anchor="middle" font-size="11" fill="#6B6B8D">Azure · Mistral · AWS Bedrock · Ollama</text>
  <!-- Provider icons as small rounded pills -->
  <rect x="176" y="1155" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="202" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">GPT-4.1</text>
  <rect x="236" y="1155" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="262" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Claude</text>
  <rect x="296" y="1155" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="322" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Gemini</text>
  <rect x="356" y="1155" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="382" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Mistral</text>
  <rect x="416" y="1155" width="52" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="442" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Local</text>

  <!-- =========== EXTERNAL: LANGFUSE =========== -->
  <rect x="560" y="1075" width="380" height="110" rx="12" fill="#FFFCF5" stroke="#C4973B" stroke-width="2" filter="url(#shadowSm)"/>
  <text x="750" y="1106" text-anchor="middle" font-size="15" font-weight="700" fill="#C4973B">Langfuse Cloud</text>
  <text x="750" y="1128" text-anchor="middle" font-size="11" fill="#6B6B8D">Traces · Token metrics · Latency</text>
  <text x="750" y="1146" text-anchor="middle" font-size="11" fill="#6B6B8D">Cost tracking · Prompt management</text>
  <!-- Metric pills -->
  <rect x="626" y="1155" width="60" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="656" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Traces</text>
  <rect x="694" y="1155" width="60" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="724" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Metrics</text>
  <rect x="762" y="1155" width="60" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="792" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Errors</text>
  <rect x="830" y="1155" width="60" height="16" rx="4" fill="rgba(196,151,59,0.12)"/>
  <text x="860" y="1167" text-anchor="middle" font-size="8" font-weight="600" fill="#C4973B">Costs</text>

  <!-- =========== LEGEND =========== -->
  <rect x="240" y="1230" width="620" height="60" rx="10" fill="#fff" filter="url(#shadowSm)"/>

  <!-- Ingress -->
  <rect x="270" y="1250" width="16" height="16" rx="4" fill="url(#goldGrad)"/>
  <text x="294" y="1263" font-size="11" fill="#6B6B8D">Ingress / Gateway</text>

  <!-- Core -->
  <rect x="430" y="1250" width="16" height="16" rx="4" fill="url(#navyGrad)"/>
  <text x="454" y="1263" font-size="11" fill="#6B6B8D">Core Services</text>

  <!-- Infra -->
  <rect x="580" y="1250" width="16" height="16" rx="4" fill="#F0EDE6" stroke="#D9D3C7" stroke-width="1"/>
  <text x="604" y="1263" font-size="11" fill="#6B6B8D">Infrastructure</text>

  <!-- External -->
  <rect x="720" y="1250" width="16" height="16" rx="4" fill="#FFFCF5" stroke="#C4973B" stroke-width="1.5"/>
  <text x="744" y="1263" font-size="11" fill="#6B6B8D">External</text>

</svg>
