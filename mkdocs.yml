site_name: Gayithri Ponnapalli
site_description: AI Engineer helping teams build reliable RAG assistants, chatbots, and AI automation using Python, FastAPI, and LLMs.
site_url: https://gayithriponnapalli.com

nav:
  - Home:
    - index.md
  - Case Studies:
    - Overview: portfolio/index.md
    - Projects:
      - portfolio/projects/project-4.md
      - portfolio/projects/project-3.md
      - portfolio/projects/project-2.md
      # - portfolio/projects/project-1.md  # Uncomment to re-add Project 1
  - Blog:
    - blog/index.md 

theme:
  name: material
  features:
    - search.suggest
    - toc.integrate
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - navigation.footer
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: custom
      accent: custom  
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: custom
      accent: custom
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/slash-forward-box
  favicon: assets/favicon.png

extra:
  generator: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gayithri606
    - icon: fontawesome/brands/upwork
      link: https://www.upwork.com/freelancers/gayithrip?viewMode=1
  analytics:
    # provider: google
    # property: G-W9Y130NXVZ

extra_css:
  - stylesheets/extra.css
  - stylesheets/hero.css
plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#111111"
  - blog:
      blog_dir: blog
      authors_file: "{blog}/.authors.yml"
      categories: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.keys

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js

extra_files:
  - docs/robots.txt

copyright: |
  &copy; 2026 <a href="https://www.upwork.com/freelancers/gayithrip?viewMode=1" target="_blank" rel="noopener">Gayithri Ponnapalli</a>. All rights reserved.
